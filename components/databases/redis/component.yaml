apiVersion: kubesandbox.io/v1
kind: Component
metadata:
  name: redis
  version: "7.0"
  category: database
  displayName: "Redis 7"
  description: >-
    Redis 7 database add-on (doc §3.3, §16) — distinct from the Redis instance in
    docker-compose.yml, which is control-plane infra (session/attach-lock registry),
    not a sandbox add-on. Composed into a SandboxTemplate as a sidecar, reachable from
    main over localhost only. Redis has no SQL-style role/grant model, so the
    "no superuser" principle is applied via Redis' own ACL SETUSER mechanism instead
    (see hooks.py).

spec:
  source:
    type: image
    image: { repository: redis, tag: "7-alpine" }

  provides:
    commands: ["redis-cli"]
    service: { protocol: redis, port: 6379, dsnEnv: "DATABASE_URL" }

  runtime:
    kind: sidecar
    weightClass: light
    # The official redis image creates its `redis` user/group at uid/gid 999 (its own
    # Dockerfile: `addgroup -S -g 999 redis && adduser -S -G redis -u 999 redis`) —
    # not yet live-verified against a running container in this repo's environment
    # (Phase 5's live-verification hand-off loop; see docs/TASK_CHECKLIST.md's Phase 5
    # section).
    uid: 999
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "250m", memory: "128Mi" }
    ports:
      - { name: redis, containerPort: 6379 }
    healthCheck:
      exec: ["redis-cli", "ping"]

  access:
    network:
      egress: denied
      reachableFrom: same-pod-only
    filesystem:
      workdir: /data
      writablePaths: ["/data", "/tmp"]
      readOnlyRootFilesystem: false
    limits:
      processes: 64
      outputBytes: 2000000
      wallClockSeconds: 30
    database:
      superuser: false
      role: sandbox_user
      # Redis ACL rule tokens (Redis' own native vocabulary, not the SQL GRANT
      # vocabulary the postgresql/mysql components use) — applied verbatim by
      # hooks.py's `ACL SETUSER`. "~*": all keys (no further keyspace restriction
      # needed; this Redis instance is single-tenant, dedicated to one sandbox).
      # "+@all -@dangerous": every command except Redis' own @dangerous category
      # (FLUSHALL, FLUSHDB, CONFIG, SHUTDOWN, DEBUG, ACL, MONITOR, REPLICAOF, ...).
      grants: ["~*", "+@all", "-@dangerous"]
      forbidden: ["FLUSHALL", "FLUSHDB", "CONFIG", "SHUTDOWN", "DEBUG"]
      # No adminPasswordEnv: the official redis image has no env-based bootstrap
      # password mechanism (unlike Postgres/MySQL) — it starts with the default user
      # unauthenticated (no `requirepass`), which is exactly what lets on_provision's
      # hook connect and run ACL SETUSER at all. The hook disables the default user
      # immediately afterward (see hooks.py).
      limits: { maxConnections: 10 }

  requires: []

  hooks:
    module: components.databases.redis.hooks

  compatibility:
    environments: ["local", "aks-prod"]
