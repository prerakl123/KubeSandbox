# `aks-prod` overlay — sandbox-primitive Kustomize layer (doc §15; the control-plane
# Deployment itself is the Helm chart, roadmap Phase 9, not part of this tree).
#
# RuntimeClass wiring: KubernetesProvisioner reads `provisioner.runtime_class: gvisor`
# from config/settings/aks-prod.yaml and sets it on every sandbox pod it creates — the
# `gvisor` RuntimeClass object itself comes from the shared base
# (manifests/base/runtimeclass.yaml) unchanged; nothing to patch here. It only actually
# takes effect once the node pool has the gVisor containerd shim installed
# (cluster/infra-level, outside this repo, roadmap Phase 9).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../manifests/base
  - networkpolicy-allow.yaml

patches:
  - path: resourcequota-patch.yaml
