{{- if .Values.secrets.keyVault.enabled }}
{{/*
Azure Key Vault via the Secrets Store CSI driver (doc §7's "Azure Key Vault (CSI)", §6
Layer 6's "secrets via Azure Key Vault / K8s Secrets (never in manifests)").

`secretObjects` is the part that matters: mounting the vault as files alone wouldn't
help, because app/core/config.py reads its settings from *env vars*. Syncing them into a
Kubernetes Secret is what lets the Deployments reference them via `secretKeyRef` — and
that sync only happens while at least one pod mounts the volume, which is why every
`secretKeyRef` in _helpers.tpl is marked `optional: true` (otherwise the first pod would
wait for a Secret whose creation depends on that pod starting).

Requires the CSI driver and its Azure provider installed on the cluster, and the
identity in `clientId` granted `get` on secrets in the vault's access policy / RBAC.
*/}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "kubesandbox.fullname" . }}-keyvault
  labels:
    {{- include "kubesandbox.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ include "kubesandbox.secretName" . }}
      type: Opaque
      data:
        {{- range .Values.secrets.keyVault.secrets }}
        - objectName: {{ .vaultKey | quote }}
          key: {{ .envVar | quote }}
        {{- end }}
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.secrets.keyVault.clientId | quote }}
    keyvaultName: {{ .Values.secrets.keyVault.name | quote }}
    tenantId: {{ .Values.secrets.keyVault.tenantId | quote }}
    objects: |
      array:
        {{- range .Values.secrets.keyVault.secrets }}
        - |
          objectName: {{ .vaultKey }}
          objectType: secret
        {{- end }}
{{- end }}
