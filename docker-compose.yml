# Local dev supporting infra only (doc §15) — Postgres, Redis, MinIO (S3-compatible
# stand-in for Azure Blob), and a local pull-based image registry (ACR stand-in).
#
# The control-plane app itself is NOT containerized here on purpose: it needs to talk
# to the *host's* Docker daemon to create sandbox containers (DockerProvisioner), which
# is simplest when it runs natively on the host (`uv run uvicorn app.main:app --reload`)
# rather than fighting docker-socket-mount permissions from inside its own container.
# See deploy/dockerfiles/Dockerfile.control-plane for the containerized path (used for
# aks-prod image parity / kind testing), and README.md for the full local setup.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kubesandbox
      POSTGRES_PASSWORD: kubesandbox
      POSTGRES_DB: kubesandbox
    ports:
      - "5432:5432"
    volumes:
      - kubesandbox_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubesandbox"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kubesandbox
      MINIO_ROOT_PASSWORD: kubesandbox-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kubesandbox_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  registry:
    image: registry:2
    ports:
      - "5000:5000"
    volumes:
      - kubesandbox_registry_data:/var/lib/registry

volumes:
  kubesandbox_postgres_data:
  kubesandbox_minio_data:
  kubesandbox_registry_data:
