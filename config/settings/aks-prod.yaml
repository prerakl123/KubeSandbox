# AKS production profile — Kubernetes provisioner, Azure-backed infra.
# Dev and prod are the same cluster/config family per management directive
# (docs/ARCHITECTURE_AND_PLAN.md §7) — this is the only non-local profile.

app_env: aks-prod
debug: false

database:
  # Real DSN is injected via env var / Key Vault at deploy time, not committed here.
  dsn: "postgresql+asyncpg://kubesandbox@REPLACE_ME:5432/kubesandbox"

redis:
  url: "redis://REPLACE_ME:6379/0"

object_storage:
  provider: azure_blob
  endpoint: "https://kubesandboxprod.blob.core.windows.net"
  bucket: "kubesandbox"

image_registry:
  provider: acr
  endpoint: "kubesandboxprod.azurecr.io"

secrets:
  provider: azure_keyvault
  vault_url: "https://kubesandbox-prod.vault.azure.net/"

provisioner:
  backend: kubernetes
  runtime_class: gvisor
  namespace_prefix: "kubesandbox-sb-"
  # Heavy-workload segregation (doc §4.3). These MUST match the label and taint
  # deploy/azure/provision-nodepools.sh applies to the `heavy` node pool — they are two
  # halves of one decision, and if they disagree heavy sandboxes either stop being
  # segregated or stop scheduling at all, neither of which fails loudly. No longer
  # REPLACE_ME: the provisioning script is now the authority for these exact values.
  heavy_node_selector:
    kubesandbox.io/workload-class: "heavy"
  heavy_tolerations:
    - key: "kubesandbox.io/heavy"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

pool:
  enabled: true
  light_pool_size: 10
  standard_pool_size: 5
  heavy_pool_size: 2
  # Segregation on aks-prod comes from the node pool + taints above, not a semaphore
  # (that's a `local`-only stand-in, doc §7) — null means unbounded here.
  heavy_max_concurrent: null

workspace:
  persistence_enabled: true
  default_quota_mb: 10240
  idle_retention_days: 30
  archive_grace_days: 60
  max_lifetime_days: 365

ttl:
  default_idle_seconds: 900
  default_max_seconds: 7200

reconciler:
  interval_seconds: 30
  orphan_grace_seconds: 120

limits:
  default_wall_clock_seconds: 60
  max_output_bytes: 5000000
  max_processes: 128

billing:
  default_mode: credit
  # Same "requires operational setup first" caveat as local.yaml — REPLACE_ME once
  # tenant wallets are funded and pricing_rules are configured for real.
  enabled: false

observability:
  metrics_enabled: true
  # REPLACE_ME: flip to true and point otlp_endpoint at the cluster's collector
  # Service once one is deployed. Left false (with a null endpoint) rather than
  # pre-filled, because ObservabilitySettings refuses tracing_enabled without an
  # endpoint — so a half-configured profile fails at startup instead of silently
  # dropping every span into a retry loop.
  tracing_enabled: false
  otlp_endpoint: null
  service_name: kubesandbox
  # Full sampling for the initial prod rollout; lower once span volume is a real cost.
  trace_sample_ratio: 1.0

auth:
  disabled: false
  oidc_issuer: "https://login.microsoftonline.com/REPLACE_ME/v2.0"
