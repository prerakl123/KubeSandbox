# Local development profile — Docker provisioner, self-hosted infra, no cloud dependency.
# See docs/ARCHITECTURE_AND_PLAN.md §7 for the local/aks-prod comparison table.

app_env: local
debug: true

database:
  dsn: "postgresql+asyncpg://kubesandbox:kubesandbox@localhost:5432/kubesandbox"

redis:
  url: "redis://localhost:6379/0"

object_storage:
  provider: minio
  endpoint: "http://localhost:9000"
  access_key: "kubesandbox"
  secret_key: "kubesandbox-secret"
  bucket: "kubesandbox"

image_registry:
  provider: local
  endpoint: "localhost:5000"

secrets:
  provider: dotenv

provisioner:
  backend: docker
  runtime_class: null
  namespace_prefix: "kubesandbox-sb-"
  heavy_node_selector: {}
  heavy_tolerations: []

pool:
  enabled: false
  light_pool_size: 0
  standard_pool_size: 0
  heavy_pool_size: 0
  heavy_max_concurrent: 2

workspace:
  persistence_enabled: false
  default_quota_mb: 10240
  idle_retention_days: 30
  archive_grace_days: 60
  max_lifetime_days: 365

ttl:
  default_idle_seconds: 900
  default_max_seconds: 7200

reconciler:
  interval_seconds: 30
  orphan_grace_seconds: 120

limits:
  default_wall_clock_seconds: 60
  max_output_bytes: 5000000
  max_processes: 128

billing:
  default_mode: credit
  # Off by default — see app/core/config.py's BillingSettings.enabled docstring. Flip
  # to true (and configure pricing-rules + fund tenant wallets via the admin APIs)
  # to actually exercise pre-authorization/usage-recording locally.
  enabled: false

auth:
  # Convenience only: lets /execute be exercised without an IdP during local dev.
  # app/core/config.py refuses this outside app_env=local.
  disabled: true
  oidc_issuer: null
