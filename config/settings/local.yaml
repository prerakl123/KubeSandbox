# Local development profile — Docker provisioner, self-hosted infra, no cloud dependency.
# See docs/ARCHITECTURE_AND_PLAN.md §7 for the local/aks-prod comparison table.

app_env: local
debug: true

database:
  dsn: "postgresql+asyncpg://kubesandbox:kubesandbox@localhost:5432/kubesandbox"

redis:
  url: "redis://localhost:6379/0"

object_storage:
  provider: minio
  endpoint: "http://localhost:9000"
  access_key: "kubesandbox"
  secret_key: "kubesandbox-secret"
  bucket: "kubesandbox"

image_registry:
  provider: local
  endpoint: "localhost:5000"

secrets:
  provider: dotenv

provisioner:
  backend: docker
  runtime_class: null
  namespace_prefix: "kubesandbox-sb-"
  heavy_node_selector: {}
  heavy_tolerations: []

pool:
  enabled: false
  light_pool_size: 0
  standard_pool_size: 0
  heavy_pool_size: 0
  heavy_max_concurrent: 2

workspace:
  persistence_enabled: false
  default_quota_mb: 10240
  idle_retention_days: 30
  archive_grace_days: 60
  max_lifetime_days: 365

ttl:
  default_idle_seconds: 900
  default_max_seconds: 7200

reconciler:
  interval_seconds: 30
  orphan_grace_seconds: 120

limits:
  default_wall_clock_seconds: 60
  max_output_bytes: 5000000
  max_processes: 128

billing:
  default_mode: credit
  # Off by default — see app/core/config.py's BillingSettings.enabled docstring. Flip
  # to true (and configure pricing-rules + fund tenant wallets via the admin APIs)
  # to actually exercise pre-authorization/usage-recording locally.
  enabled: false

quota:
  # Off by default like every other opt-in subsystem. Flip to true to exercise the
  # concurrency/monthly-minute caps locally — the defaults below then apply per tenant.
  enabled: false
  default_max_concurrent_sandboxes: 10
  default_max_cpu_millicores: null
  default_max_memory_mb: null
  default_max_monthly_minutes: 10000

rate_limit:
  # Off locally: throttling a developer hitting /docs by hand is pure friction, and the
  # limiter needs Redis (docker-compose provides it, but not everyone runs it).
  enabled: false
  execute_per_minute: 30
  mutation_per_minute: 120
  read_per_minute: 600

audit:
  # ON, unlike the others — doc §6 Layer 5 counts the audit log as a security layer, not
  # a feature, and a local deployment that isn't recording actions gives a misleading
  # picture of what prod will do.
  enabled: true
  retention_days: 365

observability:
  # Metrics cost nothing locally and make `GET /metrics` available for eyeballing
  # during development. Tracing needs a real OTLP collector, which local doesn't run
  # (docker-compose.yml has no collector service) — point otlp_endpoint at one and
  # flip tracing_enabled if you want to try it.
  metrics_enabled: true
  tracing_enabled: false
  otlp_endpoint: null
  service_name: kubesandbox
  trace_sample_ratio: 1.0

auth:
  # Convenience only: lets /execute be exercised without an IdP during local dev.
  # app/core/config.py refuses this outside app_env=local.
  disabled: true
  oidc_issuer: null
