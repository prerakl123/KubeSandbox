apiVersion: kubesandbox.io/v1
kind: Component
metadata:
  name: widget
  version: "1.0"
  category: tool
spec:
  source:
    type: image
    image: { repository: kubesandbox/widget, tag: "1.0" }
  runtime:
    kind: mainTool
    resources:
      requests: { cpu: "50m", memory: "64Mi" }
      limits: { cpu: "200m", memory: "128Mi" }
  access:
    filesystem:
      workdir: /workspace
      writablePaths: ["/workspace"]
    limits:
      processes: 16
      outputBytes: 100000
      wallClockSeconds: 10
